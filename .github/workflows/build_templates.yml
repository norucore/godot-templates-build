name: Build Godot encrypted templates

# Manual only: the AES key secret must be set before the first run.
on:
  workflow_dispatch:

env:
  GODOT_VERSION_TAG: 4.7-stable
  SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.SCRIPT_AES256_ENCRYPTION_KEY }}

jobs:
  build-templates:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 = glibc 2.35: the template must start on Ubuntu 22.04.
          - os: ubuntu-22.04
            platform: linuxbsd
            arch: x86_64
            name: custom_template_linuxbsd
          - os: ubuntu-latest
            platform: windows
            arch: x86_64
            name: custom_template_windows
          - os: macos-latest
            platform: macos
            arch: arm64
            name: custom_template_macos

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION_TAG }}
          path: godot

      - name: Verify encryption key
        run: |
          if [ -z "$SCRIPT_AES256_ENCRYPTION_KEY" ]; then
            echo "ERROR: SCRIPT_AES256_ENCRYPTION_KEY is missing. Add it to the repository secrets."
            exit 1
          fi

      - name: Setup Windows cross-compilation
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update && sudo apt-get install -y mingw-w64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix || true
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix || true

      - name: Setup Linux dependencies
        if: matrix.platform == 'linuxbsd'
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev yasm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup D3D12 SDK (Windows)
        if: matrix.platform == 'windows'
        working-directory: godot
        run: python misc/scripts/install_d3d12_sdk_windows.py

      - name: Setup MoltenVK (macOS)
        if: matrix.platform == 'macos'
        working-directory: godot
        run: |
          curl -L "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.2.7/MoltenVK-macos.tar" | tar -x -f -
          echo "VULKAN_SDK_PATH=$(pwd)/MoltenVK" >> $GITHUB_ENV

      - name: Setup SCons
        run: |
          python -m pip install --upgrade pip
          pip install scons

      # Only the release template: every export preset uses it for debug too.
      - name: Compile Godot template (release)
        working-directory: godot
        run: |
          scons platform=${{ matrix.platform }} target=template_release arch=${{ matrix.arch }} production=yes ${VULKAN_SDK_PATH:+vulkan_sdk_path="$VULKAN_SDK_PATH"} -j4

      - name: Report required glibc (Linux)
        if: matrix.platform == 'linuxbsd'
        working-directory: godot
        run: objdump -T bin/godot.linuxbsd.* | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1

      # The template embeds the AES key: artifacts of a public repository are
      # downloadable by anyone, so they are encrypted to a certificate whose
      # private key never leaves the maintainer's machine.
      - name: Encrypt artifacts
        working-directory: godot
        run: |
          mkdir -p ../out
          for f in bin/godot.*; do
            gzip -9 -c "$f" > "../out/$(basename "$f").gz"
          done
          cd ../out
          for f in *.gz; do
            openssl cms -encrypt -binary -aes256 -outform DER -in "$f" -out "$f.p7" ../builder/artifact_cert.pem
            rm "$f"
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*.p7
          retention-days: 1
